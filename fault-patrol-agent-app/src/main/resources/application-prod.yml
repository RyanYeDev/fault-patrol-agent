server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 100
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 生产环境数据库配置：通过环境变量注入，避免明文落盘
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  datasource:
    mysql:
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fault_patrol_agent?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: FaultPatrol_HikariCP
        minimum-idle: 10
        idle-timeout: 180000
        maximum-pool-size: 30
        auto-commit: true
        max-lifetime: 1800000
        connection-timeout: 30000
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:}
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/fault_patrol_rag}
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: BAAI/bge-m3
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1000ms
        multiplier: 2
        max-interval: 5000ms
    agent:
      auto-config:
        enabled: true

# 平台配置
faultpatrol:
  # 接口安全配置（key 为空表示对应接口不鉴权；生产环境请配置环境变量）
  security:
    enabled: true
    inspect-api-key: ${INSPECT_API_KEY:}
    admin-api-key: ${ADMIN_API_KEY:}
  # LLM 调用超时（毫秒）
  llm:
    connect-timeout-ms: 30000
    read-timeout-ms: 120000
  # 告警接入配置
  alert:
    default-agent-id: 10001
    # webhook 签名密钥（HMAC-SHA256），配置后强制校验 X-Webhook-Signature
    webhook-secret: ${WEBHOOK_SECRET:}
  # 定时巡检任务配置
  task:
    job:
      enabled: true
      pool-size: 5
      thread-name-prefix: "fault-patrol-task-scheduler-"
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination-seconds: 30
      refresh-interval: 60000
      clean-invalid-tasks-cron: "0 0/10 * * * ?"

# 平台自观测（/actuator/health /actuator/prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
